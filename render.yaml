services:
  # Frontend (Web Service - mantiene compatibilidad con configuracion anterior)
  - type: web
    name: pagos-frontend
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    # GET / redirige a /pagos; healthCheckPath /health devuelve 200 JSON sin pasar por el proxy.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      # API_BASE_URL: URL del backend para proxy /api/*. Render la inyecta desde pagos-backend.
      - key: API_BASE_URL
        fromService:
          name: pagos-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # No definir aquí VITE_API_URL apuntando al API en otro host: el bundle usa /api same-origin y este
      # servicio reenvía con API_BASE_URL. VITE_API_URL cruzado solo añade avisos en consola y no es necesario.

  # Backend
  - type: web
    name: pagos-backend
    env: python
    # --with-deps: libs del SO para Chromium (sin esto el PDF de Evidencias cae a texto plano).
    buildCommand: pip install -r ../requirements.txt && python -m playwright install --with-deps chromium
    # Migraciones antes del swap de trafico: el proceso de arranque solo levanta Gunicorn
    # (evita timeout de deploy si alembic + import pesado superan el margen de Render).
    preDeployCommand: alembic upgrade head
    # graceful-timeout 900 + SIN max-requests: lotes BG notif no se cortan por recycle.
    # IMPORTANTE: Dashboard Start Command manual IGNORA Blueprint; sincronizar a mano.
    # Defensa en codigo: backend/gunicorn.conf.py (keepalive + post_fork)
    # aun si el Dashboard conserva --max-requests / graceful-timeout 60.
    startCommand: gunicorn app.main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 920 --graceful-timeout 900 --worker-class uvicorn.workers.UvicornWorker
    rootDir: backend
    # /health responde sin BD; /health/db puede marcar 503 si Postgres aun no acepta conexiones.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # URL interna Valkey (misma región). No usar External URL ni abrir ipAllowList salvo dev local.
      - key: REDIS_URL
        fromService:
          name: pagos-redis
          type: keyvalue
          property: connectionString
    # NOTA: Las variables de entorno sensibles (WHATSAPP_ACCESS_TOKEN, etc.)
    # deben configurarse manualmente en Render Dashboard por seguridad

