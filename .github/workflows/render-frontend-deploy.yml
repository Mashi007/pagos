# Dispara redeploy del frontend en Render cuando cambia frontend/ en main.
# Requiere secret RENDER_DEPLOY_HOOK_URL (Deploy Hook del servicio rapicredit-frontend).
name: Render frontend deploy hook

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/render-frontend-deploy.yml'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    # `secrets` no es válido en `if:` de un step; se expone vía env.
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: POST deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Skip (no hook configured)
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "::warning::RENDER_DEPLOY_HOOK_URL no configurado; redeploy manual en Render."
